server.port=${LINK_SERVICE_PORT}
app.base-url=${LINK_SERVICE_BASE_URL}

# Datasource Configuration
spring.datasource.url=${LINK_SERVICE_DB_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# JWT Configuration
app.security.jwt.secret=${LINK_SERVICE_JWT_SECRET_BASE64}

# Redis (shared counters for the distributed rate limiter)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Rate limit: link creations allowed per user within the window
app.rate-limit.link-creation.limit=10
app.rate-limit.link-creation.window=60s
