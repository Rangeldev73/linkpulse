server.port=${REDIRECT_SERVICE_PORT}

# Datasource Configuration
spring.datasource.url=${LINK_SERVICE_DB_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka producer: a redirect must never wait for Kafka.
# send() only blocks when topic metadata or buffer space is missing (default max.block.ms is 60000).
# With the broker down, each send() now gives up after 100 ms instead of stalling the request thread.
spring.kafka.producer.properties.max.block.ms=100
